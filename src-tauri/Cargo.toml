[package]
name = "redactpad"
version = "0.1.1"
edition = "2021"

[lib]
name = "redactpad_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.21"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", default-features = false, features = ["wry"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
proptest = "1"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", default-features = false }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL"] }
